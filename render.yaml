services:
  # DOCly frontend — static site (React + Vite)
  - type: web
    name: docly
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      # long-cache hashed assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      # SPA fallback so /tools/:slug and other client routes load index.html
      - type: rewrite
        source: /*
        destination: /index.html
