<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DOCly — Every document. One simple toolbox. A free, open-source PDF toolbox: merge, compress, convert, edit and protect your PDFs." />
    <title>DOCly — Every document. One simple toolbox.</title>
    <script>
      (function () {
        var pref = localStorage.getItem("docly-theme") || "system";
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
